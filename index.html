<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dragobound</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🐉</text></svg>" />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>

<div id="fatal-error" class="hidden"></div>

<div id="title-screen" class="screen">
  <div class="title-card">
    <h1 class="game-title">DRAGOBOUND</h1>
    <p class="game-subtitle">A century after the war, the last of Veth Hollow endures.</p>

    <div id="signin-panel" class="panel">
      <label for="signin-name">Sign in to save your progress</label>
      <input id="signin-name" type="text" maxlength="16" placeholder="Enter your name..." autocomplete="off" />
      <button id="btn-signin" class="btn btn-primary">Sign In</button>
      <p class="hint">No password needed -- this saves your progress in this browser.</p>
    </div>

    <div id="profile-panel" class="panel hidden">
      <p class="signed-in-as">Signed in as <span id="profile-name-label"></span></p>
      <button id="btn-new-game" class="btn btn-primary">New Game</button>
      <button id="btn-continue" class="btn hidden">Continue</button>
      <button id="btn-switch-profile" class="btn btn-link">Not you? Switch profile</button>
    </div>
  </div>
</div>

<div id="charcreate-screen" class="screen hidden">
  <div class="title-card">
    <h2 class="section-title">Create Your Knight</h2>

    <label for="char-name">Your character's name</label>
    <input id="char-name" type="text" maxlength="16" placeholder="Knight of Veth Hollow" autocomplete="off" />

    <p class="section-label">Choose your look</p>
    <div id="palette-choices" class="palette-grid"></div>

    <button id="btn-begin" class="btn btn-primary">Begin</button>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <div id="hud-top">
    <div id="hp-wrap"><div id="hp-bar"></div></div>
    <div id="objective-text"></div>
  </div>
  <canvas id="game-canvas" width="704" height="576"></canvas>
  <div id="hud-bottom">Move: Arrows / WASD &nbsp;·&nbsp; Attack: Space &nbsp;·&nbsp; Talk / Interact: E</div>

  <div id="dialogue-box" class="hidden">
    <div class="dlg-name"></div>
    <div class="dlg-text"></div>
    <div class="dlg-choices"></div>
    <div class="dlg-continue">▼</div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
